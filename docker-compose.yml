# ═══════════════════════════════════════════════════════════════════════════
#  Telco Churn Analytics — Docker Compose
#  Arsitektur: Medallion (Bronze → Silver → Gold)
#  Services: etl, metabase
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── ETL Pipeline (Medallion: Bronze → Silver → Gold) ─────────────────────
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_etl
    volumes:
      - ./data:/app/data
      - ./etl:/app/etl
      - ./ml:/app/ml
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DUCKDB_PATH=/app/data/gold/telco_warehouse.duckdb
      - ML_SCORES_PATH=/app/ml/models/churn_scores.csv
    command: bash scripts/entrypoint.sh # ← pastikan ini ada
    networks:
      - telco_net

  # ── Metabase (baca dari Gold layer DuckDB) ────────────────────────────────
  # Akses: http://localhost:3000
  # Koneksi: Add Database → DuckDB → /metabase-gold/telco_warehouse.duckdb
  # Tabel tersedia: gold_churn_risk, gold_customer_segments, gold_churn_summary
  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    container_name: telco_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
      - ./data/gold:/metabase-gold
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TIMEZONE=Asia/Jakarta
      - MB_PLUGINS_DIR=/plugins
    depends_on:
      etl:
        condition: service_completed_successfully
    networks:
      - telco_net
    restart: unless-stopped

volumes:
  metabase_data:

networks:
  telco_net:
    driver: bridge
