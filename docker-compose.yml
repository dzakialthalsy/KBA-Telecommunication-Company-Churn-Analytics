# ═══════════════════════════════════════════════════════════════════════════
#  Telco Churn Analytics — Docker Compose
#  Arsitektur: Medallion + RBAC via PostgreSQL Katalog
#  Services: catalog_db, etl, metabase, metabase_setup, dashboard
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── 1. PostgreSQL Catalog (RBAC roles & users) ─────────────────────────
  catalog_db:
    image: postgres:15
    container_name: telco_catalog
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=ducklake_catalog
    volumes:
      - catalog_data:/var/lib/postgresql/data
      - ./scripts/init_catalog.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ducklake_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telco_net

  # ── 2. ETL Pipeline (Bronze → Silver → Gold) ──────────────────────────
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_etl
    volumes:
      - ./data:/app/data
      - ./etl:/app/etl
      - ./ml:/app/ml
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DUCKDB_PATH=/app/data/gold/telco_warehouse.duckdb
      - ML_SCORES_PATH=/app/ml/models/churn_scores.csv
      - CATALOG_URL=postgresql://admin:password123@catalog_db:5432/ducklake_catalog
    depends_on:
      catalog_db:
        condition: service_healthy
    networks:
      - telco_net

  # ── 3. Metabase Dashboard ──────────────────────────────────────────────
  # Akses: http://localhost:3000
  # Koneksi DuckDB: /metabase-gold/telco_warehouse_readonly.duckdb
  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    container_name: telco_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
      - ./data/gold:/metabase-gold
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TIMEZONE=Asia/Jakarta
      - MB_PLUGINS_DIR=/plugins
    depends_on:
      catalog_db:
        condition: service_healthy
    networks:
      - telco_net
    restart: unless-stopped

  # ── 4. Metabase RBAC Setup (one-shot, tunggu ETL + Metabase siap) ──────
  # Service ini:
  #   - Tunggu ETL selesai (service_completed_successfully)
  #   - Tunggu Metabase siap via API polling
  #   - Daftarkan DuckDB ke Metabase
  #   - Buat groups (Executive, Operational, Analyst) + users demo
  #   - Exit setelah selesai
  metabase_setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_metabase_setup
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - CATALOG_URL=postgresql://admin:password123@catalog_db:5432/ducklake_catalog
      - METABASE_URL=http://metabase:3000
    command: python scripts/setup_metabase_rbac.py
    depends_on:
      etl:
        condition: service_completed_successfully
      metabase:
        condition: service_started
    networks:
      - telco_net
    restart: "no" # jangan restart — cukup sekali

  # â”€â”€ 5. Executive Dashboard + Predictor (Docker-only access) â”€â”€â”€â”€â”€â”€â”€â”€
  # Akses:
  #   docker compose up --build dashboard
  #   http://127.0.0.1:8000
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.inference
    container_name: telco_dashboard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml:/app/ml
      - ./dashboard:/app/dashboard
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - APP_DOCKER_RUNTIME=true
      - APP_REQUIRE_DOCKER=true
      - DUCKDB_PATH=/app/data/gold/telco_warehouse.duckdb
      - ML_SCORES_PATH=/app/ml/models/churn_scores.csv
      - RAW_DATA_PATH=/app/data/raw/Telecom_customer.csv
    depends_on:
      etl:
        condition: service_completed_successfully
    networks:
      - telco_net
    restart: unless-stopped

volumes:
  metabase_data:
  catalog_data:

networks:
  telco_net:
    driver: bridge
