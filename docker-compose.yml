services:
  catalog_db:
    image: postgres:15
    container_name: telco_catalog
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=ducklake_catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ducklake_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telco_net

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_etl
    volumes:
      - ./data:/app/data
      - ./etl:/app/etl
      - ./ml:/app/ml
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DUCKDB_PATH=/app/data/gold/telco_warehouse.duckdb
      - ML_SCORES_PATH=/app/ml/models/churn_scores.csv
      - CATALOG_URL=postgresql://admin:password123@catalog_db:5432/ducklake_catalog
    depends_on:
      catalog_db:
        condition: service_healthy
    networks:
      - telco_net

  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    container_name: telco_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
      - ./data/gold:/metabase-gold
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TIMEZONE=Asia/Jakarta
      - MB_PLUGINS_DIR=/plugins
    depends_on:
      catalog_db:          # ← Metabase tidak lagi tunggu etl selesai
        condition: service_healthy
    networks:
      - telco_net
    restart: unless-stopped

volumes:
  metabase_data:

networks:
  telco_net:
    driver: bridge