version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
#  Telco Churn Analytics — Docker Compose
#  Kelompok 4 | Kecerdasan Bisnis dan Analitik
#
#  Services:
#    1. etl      — ETL pipeline Python → DuckDB (file-based, no separate service)
#    2. metabase — Dashboard & visualisasi (baca dari file DuckDB)
#
#  NOTE: DuckDB adalah file-based database (seperti SQLite).
#        Tidak perlu service tersendiri — cukup mount volume ke folder data/mart/
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── 1. ETL Pipeline ──────────────────────────────────────────────────────
  #  Tugas: baca CSV → transform → tulis ke data/mart/telco_warehouse.duckdb
  #  Owner task: Dhea (DE-07, DE-08, DE-09)
  #  Run manual: docker compose run --rm etl
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_etl
    volumes:
      - ./data:/app/data        # mount seluruh folder data (raw, staging, mart)
      - ./etl:/app/etl          # mount ETL scripts agar live-edit tanpa rebuild
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DUCKDB_PATH=/app/data/mart/telco_warehouse.duckdb
    command: python etl/run_pipeline.py
    networks:
      - telco_net

  # ── 2. Metabase (Dashboard) ───────────────────────────────────────────────
  #  Tugas: visualisasi KPI, churn risk board, drill-down
  #  Owner task: Dhea (DE-10, DE-11, DE-12)
  #  Akses: http://localhost:3000
  #
  #  Cara koneksi Metabase ke DuckDB:
  #    - Install DuckDB driver di Metabase (Settings → Database → Add Database)
  #    - Pilih tipe: DuckDB
  #    - Path file: /metabase-duckdb/telco_warehouse.duckdb
  metabase:
    image: metabase/metabase:v0.49.9
    container_name: telco_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data                        # metadata Metabase
      - ./data/mart:/metabase-duckdb:ro                     # DuckDB file (read-only)
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TIMEZONE=Asia/Jakarta
    depends_on:
      - etl
    networks:
      - telco_net
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  metabase_data:      # persistent storage untuk konfigurasi Metabase

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  telco_net:
    driver: bridge
