name: CI — ETL & ML Pipeline Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint — ETL scripts (flake8)
        run: |
          flake8 etl/ \
            --max-line-length=100 \
            --ignore=E501,W503,W504

      - name: Lint — ML scripts (flake8)
        run: |
          flake8 ml/train.py \
            --max-line-length=100 \
            --ignore=E501,W503,W504

      - name: Run tests
        run: |
          # exit code 5 = no tests collected — normal di awal sprint, bukan failure
          pytest tests/ -v --tb=short -p no:warnings || \
          [ $? -eq 5 ] && echo "No tests yet — skipping" && exit 0
