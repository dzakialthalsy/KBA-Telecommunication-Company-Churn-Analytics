version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
#  Telco Churn Analytics — Docker Compose
#  Arsitektur: Medallion (Bronze → Silver → Gold)
#  Services: etl, metabase
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── ETL Pipeline (Medallion: Bronze → Silver → Gold) ─────────────────────
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telco_etl
    volumes:
      - ./data:/app/data          # Bronze: data/raw/, Gold: data/gold/*.duckdb
      - ./etl:/app/etl
      - ./ml:/app/ml              # baca ML scores dari ml/models/churn_scores.csv
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DUCKDB_PATH=/app/data/gold/telco_warehouse.duckdb
      - ML_SCORES_PATH=/app/ml/models/churn_scores.csv
    command: python etl/run_pipeline.py
    networks:
      - telco_net

  # ── Metabase (baca dari Gold layer DuckDB) ────────────────────────────────
  # Akses: http://localhost:3000
  # Koneksi: Add Database → DuckDB → /metabase-gold/telco_warehouse.duckdb
  # Tabel tersedia: gold_churn_risk, gold_customer_segments, gold_churn_summary
  metabase:
    image: metabase/metabase:v0.49.9
    container_name: telco_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
      - ./data/gold:/metabase-gold:ro    # Gold layer (read-only untuk Metabase)
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TIMEZONE=Asia/Jakarta
    depends_on:
      - etl
    networks:
      - telco_net
    restart: unless-stopped

volumes:
  metabase_data:

networks:
  telco_net:
    driver: bridge
